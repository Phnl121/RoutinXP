<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/marca/routinxp-icone.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/marca/routinxp-icone-192.png" />
    <link rel="apple-touch-icon" href="/marca/routinxp-apple-touch-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="RoutinXP" />
    <meta name="description" content="RoutinXP: organize tarefas por categoria e ganhe XP ao concluir." />
    <title>RoutinXP</title>
    <script>
      // Tema salvo (claro, bege, escuro ou sistema) antes do primeiro desenho. Ver src/lib/tema.js.
      try {
        var p = localStorage.getItem('routinxp:tema') || 'escuro'
        var tema = p === 'sistema' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro') : p
        if (tema !== 'claro' && tema !== 'bege') tema = 'escuro'
        document.documentElement.dataset.tema = tema
        var barra = { claro: '#fbfbfd', bege: '#f7f1e5' }[tema]
        if (barra) document.querySelector('meta[name="theme-color"]').setAttribute('content', barra)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
